<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar | JasaQ</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="auth">
  <div id="site-header"></div>
  <main class="auth">
    <div class="auth-side">
      <img src="assets/img/logo.svg" alt="JasaQ logo">
      <h2>Waktu luangmu berharga.</h2>
      <p>Bergabung dengan ribuan penyedia jasa dan UMKM yang saling membantu tumbuh bersama di JasaQ.</p>
    </div>
    <div class="auth-main">
      <form class="auth-form" id="auth-form">
        <h1 id="auth-title">Selamat datang kembali</h1>
        <p class="muted" id="auth-sub" style="margin-bottom:24px">Masuk untuk melanjutkan.</p>
        <div class="role-pick">
          <label><input type="radio" name="role" value="provider" checked><div><strong>Penyedia Jasa</strong><small>Mahasiswa, freelancer</small></div></label>
          <label><input type="radio" name="role" value="umkm"><div><strong>UMKM</strong><small>Pemilik usaha</small></div></label>
        </div>
        <div class="field reg-only"><label>Nama lengkap</label><input class="input" name="name" data-req placeholder="Nama kamu"></div>
        <div class="field" id="biz-field"><label>Nama usaha</label><input class="input" name="business" placeholder="mis. Kedai Kopi Senja"></div>
        <div class="field"><label>Email</label><input class="input" type="email" name="email" required placeholder="nama@email.com"></div>
        <div class="field"><label>Kata sandi</label><input class="input" type="password" name="password" required minlength="6" placeholder="Minimal 6 karakter"></div>
        <button class="btn btn-primary btn-lg btn-block" id="auth-submit">Masuk</button>
        <p class="auth-switch" id="auth-switch"></p>
      </form>
    </div>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
