<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permintaan UMKM | JasaQ</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="requests">
  <div id="site-header"></div>
  <main>
    <section class="page-head">
      <div class="container" style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
        <div>
          <div class="crumbs"><a href="index.html">Beranda</a> / Permintaan UMKM</div>
          <h1>Permintaan dari UMKM</h1>
          <p class="lead">Pilih pekerjaan yang cocok dengan keahlian, budget, dan waktu luangmu.</p>
        </div>
        <a href="pasang.html?tab=permintaan" class="btn btn-primary">+ Pasang Permintaan</a>
      </div>
    </section>
    <div class="container listing">
      <form class="filters" id="filter-form" onsubmit="return false">
        <div id="filters"></div>
        <button type="button" class="btn btn-outline btn-block btn-sm" id="reset-filters" style="margin-top:20px">Reset filter</button>
      </form>
      <div>
        <div class="toolbar">
          <div class="search"><input class="input" id="q" placeholder="Cari permintaan atau nama usaha" aria-label="Cari"></div>
          <select class="input" id="sort" style="width:auto" aria-label="Urutkan"></select>
          <button type="button" class="btn btn-outline filter-toggle">Filter</button>
        </div>
        <p class="result-count" id="result-count"></p>
        <div class="grid-3" id="results"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
